[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-engine-core"
version = "0.1.1"
description = "A unified, high-performance Machine Learning Framework with native C++ backends"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
dependencies = [
    "numpy",
    "knn-engine-core>=0.1.2",
    "nn-engine-core>=0.1.0"
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/MLEngineProject/MLEngine"

[tool.setuptools.packages.find]
where = ["."]
include = ["ml_core*"]