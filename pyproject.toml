[build-system]
requires = ["scikit-build-core", "pybind11"]
build-backend = "scikit_build_core.build"

[project]
name = "mlengine"
version = "0.1.0"
description = "A unified, high-performance Machine Learning Framework with native C++ backends"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License"
]
dependencies = [
    "numpy",
    "scikit-learn",
    "knn-engine-core"
]

[project.urls]
Homepage = "https://github.com/YourOrganizationName/MLEngine"

[tool.scikit-build]
cmake.version = ">=3.18"

[tool.cibuildwheel]
skip = "*-musllinux_*"
