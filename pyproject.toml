[build-system]
requires = ["setuptools>=83.0.0", "wheel>=0.47.0"]
build-backend = "setuptools.build_meta"

[project]
name = "AffineFlow"
version = "0.1.3"
description = "A unified, high-performance Machine Learning Framework with native C++ backends"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "affineflow-nn",
    "affineflow-ml"
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/AffineFlow/AffineFlow"

[tool.setuptools.packages.find]
where = ["."]
include = ["affineflow*"]

[tool.setuptools.package-data]
affineflow = ["py.typed", "*.pyi"]

[project.optional-dependencies]
test = [
    "pytest",
    "scikit-learn"
]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-v"
testpaths = [
    "tests/python",
]